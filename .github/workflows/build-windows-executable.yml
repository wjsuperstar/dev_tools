name: Build Windows Executables

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Auto-update requirements.txt from tools imports
        run: |
          python scripts/update_requirements.py

      - name: Cache Nuitka builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nuitka
            C:\Users\RUNNER~1\AppData\Local\Nuitka
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/requirements.txt', '**/tools/*.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executables with Nuitka
        run: |
          $failed = @()

          Get-ChildItem -Path "tools" -Filter "*.py" | ForEach-Object {
            $fileName = $_.BaseName
            $filePath = $_.FullName
            Write-Host "Building $fileName with Nuitka"

            cmd /c "echo Y| python -m nuitka --lto=no --standalone --onefile `"$filePath`""
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Failed to build $fileName with Nuitka"
              $failed += $fileName
            } elseif (Test-Path "$fileName.exe") {
              Rename-Item -Path "$fileName.exe" -NewName "${fileName}_nuitka.exe"
              Write-Host "Successfully built ${fileName}_nuitka.exe"
            } else {
              Write-Host "Failed to build $fileName - no output file generated"
              $failed += $fileName
            }

            if (Test-Path "$fileName.build") {
              Remove-Item -Recurse -Force "$fileName.build"
            }
            if (Test-Path "$fileName.dist") {
              Remove-Item -Recurse -Force "$fileName.dist"
            }
          }

          if ($failed.Count -gt 0) {
            "Nuitka failed scripts: $($failed -join ', ')" | Out-File -FilePath nuitka_failed.txt -Encoding utf8
            Write-Host "Nuitka failed scripts: $($failed -join ', ')"
          }

      - name: Build executables with PyInstaller
        run: |
          $failed = @()

          Get-ChildItem -Path "tools" -Filter "*.py" | ForEach-Object {
            $fileName = $_.BaseName
            $filePath = $_.FullName
            $buildDir = "build_$fileName"
            $distDir = "dist_$fileName"

            Write-Host "Building $fileName with PyInstaller"
            pyinstaller --onefile --distpath $distDir --workpath $buildDir $filePath

            if ($LASTEXITCODE -ne 0) {
              Write-Host "Failed to build $fileName with PyInstaller"
              $failed += $fileName
            } elseif (Test-Path "$distDir\$fileName.exe") {
              Move-Item -Path "$distDir\$fileName.exe" -Destination "${fileName}_pyinstaller.exe"
              Write-Host "Successfully built ${fileName}_pyinstaller.exe"
            } else {
              Write-Host "Failed to build $fileName - no output file generated"
              $failed += $fileName
            }

            if (Test-Path $buildDir) {
              Remove-Item -Recurse -Force $buildDir
            }
            if (Test-Path $distDir) {
              Remove-Item -Recurse -Force $distDir
            }
          }

          if (Test-Path "build") {
            Remove-Item -Recurse -Force "build"
          }
          if (Test-Path "dist") {
            Remove-Item -Recurse -Force "dist"
          }

          if ($failed.Count -gt 0) {
            "PyInstaller failed scripts: $($failed -join ', ')" | Out-File -FilePath pyinstaller_failed.txt -Encoding utf8
            Write-Host "PyInstaller failed scripts: $($failed -join ', ')"
          }

      - name: Verify build result
        run: |
          Write-Host "=== Generated Executables ==="
          $nuitkaCount = (Get-ChildItem -Path "." -Filter "*_nuitka.exe").Count
          $pyinstallerCount = (Get-ChildItem -Path "." -Filter "*_pyinstaller.exe").Count
          Write-Host "Nuitka executables: $nuitkaCount"
          Write-Host "PyInstaller executables: $pyinstallerCount"

          if ($nuitkaCount -eq 0 -and $pyinstallerCount -eq 0) {
            Write-Host "No executables were generated. Build failed."
            exit 1
          }

          Get-ChildItem -Path "." -Filter "*_nuitka.exe" | ForEach-Object {
            Write-Host "  Nuitka: $($_.Name)"
          }
          Get-ChildItem -Path "." -Filter "*_pyinstaller.exe" | ForEach-Object {
            Write-Host "  PyInstaller: $($_.Name)"
          }

          if ((Test-Path "nuitka_failed.txt") -or (Test-Path "pyinstaller_failed.txt")) {
            if (Test-Path "nuitka_failed.txt") { Get-Content "nuitka_failed.txt" | Write-Host }
            if (Test-Path "pyinstaller_failed.txt") { Get-Content "pyinstaller_failed.txt" | Write-Host }
            Write-Host "One or more scripts failed to build in at least one backend."
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: |
            *_nuitka.exe
            *_pyinstaller.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: true
          files: |
            *_nuitka.exe
            *_pyinstaller.exe
