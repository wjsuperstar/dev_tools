name: Build Windows Executables

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_pyinstaller:
        description: '构建 PyInstaller 版本'
        type: boolean
        default: true
      build_nuitka:
        description: '构建 Nuitka 版本（较慢，产物更大，默认关闭）'
        type: boolean
        default: false

# 同一分支/标签上的并发构建互相取消，避免重复打 Release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Verify requirements.txt is up to date
        run: |
          python scripts/update_requirements.py
          git diff --exit-code -- requirements.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "requirements.txt is out of date. Run: python scripts/update_requirements.py"
            exit 1
          }

      - name: Select build backends
        id: backends
        shell: pwsh
        env:
          INPUT_NUITKA: ${{ inputs.build_nuitka }}
          INPUT_PYINSTALLER: ${{ inputs.build_pyinstaller }}
        run: |
          # 手动触发时读 workflow_dispatch 的输入；push/PR 时 inputs 为空，走默认值
          # 默认：构建 PyInstaller，不构建 Nuitka
          $nuitka = $env:INPUT_NUITKA -eq 'true'
          $pyinstaller = $env:INPUT_PYINSTALLER -ne 'false'
          if (-not $nuitka -and -not $pyinstaller) {
            Write-Host "至少要选择一种打包方式"
            exit 1
          }
          Write-Host "构建后端 -> Nuitka: $nuitka, PyInstaller: $pyinstaller"
          "nuitka=$nuitka" >> $env:GITHUB_OUTPUT
          "pyinstaller=$pyinstaller" >> $env:GITHUB_OUTPUT

      - name: Cache Nuitka builds
        if: steps.backends.outputs.nuitka == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nuitka
            C:\Users\RUNNER~1\AppData\Local\Nuitka
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/requirements.txt', '**/tools/*.py', '**/tools/common/*.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select scripts to build
        id: select
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path "tools" -Filter "*.py" |
            ForEach-Object { $_.BaseName }
          Write-Host "Scripts to build ($($scripts.Count)): $($scripts -join ', ')"
          "scripts=$($scripts -join ',')" >> $env:GITHUB_OUTPUT

      - name: Build executables with Nuitka
        if: steps.backends.outputs.nuitka == 'true'
        shell: pwsh
        env:
          SCRIPT_LIST: ${{ steps.select.outputs.scripts }}
        run: |
          $results = @()

          foreach ($fileName in ($env:SCRIPT_LIST -split ',')) {
            $filePath = Join-Path "tools" "$fileName.py"
            Write-Host "Building $fileName with Nuitka"

            # --assume-yes-for-downloads 代替 cmd /c "echo Y|"，自动确认 ccache 下载
            # --include-dir/--include-package 保证 tools/common 包被打进单文件
            python -m nuitka `
              --lto=no `
              --onefile `
              --assume-yes-for-downloads `
              --include-dir=tools `
              --include-package=common `
              --output-filename="${fileName}_nuitka.exe" `
              --remove-output `
              "$filePath"

            if ($LASTEXITCODE -ne 0 -or -not (Test-Path "${fileName}_nuitka.exe")) {
              Write-Host "Failed to build $fileName with Nuitka"
              $results += "$fileName=failed"
              continue
            }

            Write-Host "Successfully built ${fileName}_nuitka.exe"
            $results += "$fileName=ok"
          }

          $results | Out-File -FilePath "build_status_nuitka.txt" -Encoding utf8

      - name: Build executables with PyInstaller
        if: steps.backends.outputs.pyinstaller == 'true'
        shell: pwsh
        env:
          SCRIPT_LIST: ${{ steps.select.outputs.scripts }}
        run: |
          $results = @()

          foreach ($fileName in ($env:SCRIPT_LIST -split ',')) {
            $filePath = Join-Path "tools" "$fileName.py"
            $buildDir = "build_$fileName"
            Write-Host "Building $fileName with PyInstaller"

            pyinstaller --onefile --noconfirm --clean `
              --name "${fileName}_pyinstaller" `
              --distpath . `
              --workpath $buildDir `
              --specpath $buildDir `
              "$filePath"

            if ($LASTEXITCODE -ne 0 -or -not (Test-Path "${fileName}_pyinstaller.exe")) {
              Write-Host "Failed to build $fileName with PyInstaller"
              $results += "$fileName=failed"
            } else {
              Write-Host "Successfully built ${fileName}_pyinstaller.exe"
              $results += "$fileName=ok"
            }

            if (Test-Path $buildDir) {
              Remove-Item -Recurse -Force $buildDir
            }
          }

          $results | Out-File -FilePath "build_status_pyinstaller.txt" -Encoding utf8

      - name: Verify build result
        shell: pwsh
        env:
          BUILD_NUITKA: ${{ steps.backends.outputs.nuitka }}
          BUILD_PYINSTALLER: ${{ steps.backends.outputs.pyinstaller }}
        run: |
          function Read-Status($path) {
            $map = @{}
            if (Test-Path $path) {
              Get-Content $path | ForEach-Object {
                if ($_ -match "^(.+?)=(ok|failed)$") { $map[$matches[1]] = $matches[2] }
              }
            }
            return $map
          }

          $nuitkaStatus = Read-Status "build_status_nuitka.txt"
          $pyiStatus = Read-Status "build_status_pyinstaller.txt"

          Write-Host "=== Generated Executables ==="
          Get-ChildItem -Path "." -Filter "*_nuitka.exe" | ForEach-Object { Write-Host "  Nuitka:     $($_.Name)" }
          Get-ChildItem -Path "." -Filter "*_pyinstaller.exe" | ForEach-Object { Write-Host "  PyInstaller: $($_.Name)" }

          $nuitkaCount = (Get-ChildItem -Path "." -Filter "*_nuitka.exe").Count
          $pyinstallerCount = (Get-ChildItem -Path "." -Filter "*_pyinstaller.exe").Count
          Write-Host "Nuitka executables: $nuitkaCount"
          Write-Host "PyInstaller executables: $pyinstallerCount"

          # 启用的后端必须至少产出一个 exe
          if ($env:BUILD_NUITKA -eq 'true' -and $nuitkaCount -eq 0) {
            Write-Host "Nuitka was enabled but produced no executables."
            exit 1
          }
          if ($env:BUILD_PYINSTALLER -eq 'true' -and $pyinstallerCount -eq 0) {
            Write-Host "PyInstaller was enabled but produced no executables."
            exit 1
          }

          # 只有所有启用的后端都失败的脚本才算真正失败
          $broken = @()
          $allScripts = @($nuitkaStatus.Keys) + @($pyiStatus.Keys) | Sort-Object -Unique
          foreach ($script in $allScripts) {
            $results = @()
            if ($env:BUILD_NUITKA -eq 'true') { $results += $nuitkaStatus[$script] }
            if ($env:BUILD_PYINSTALLER -eq 'true') { $results += $pyiStatus[$script] }
            if ($results.Count -gt 0 -and ($results | Where-Object { $_ -ne 'failed' }).Count -eq 0) {
              $broken += $script
            }
          }

          if ($broken.Count -gt 0) {
            Write-Host "Scripts that failed with every enabled backend: $($broken -join ', ')"
            exit 1
          }

          Write-Host "Build succeeded."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          if-no-files-found: warn
          path: |
            *_nuitka.exe
            *_pyinstaller.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          # v1.0.0 -> 正式版；v1.0.0-rc1 -> 预发布
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            *_nuitka.exe
            *_pyinstaller.exe
